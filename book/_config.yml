title: Earth in the Browser
author: JupyterLite-zarr-sql-views contributors
copyright: '2026'
logo: assets/favicon.svg
only_build_toc_files: true
execute:
  execute_notebooks: 'off'
repository:
  url: https://github.com/jltobias/JupyterLite-zarr-sql-views
  branch: main
html:
  use_repository_button: true
  use_issues_button: true
  extra_navbar: '<a href="../index.html">Earth lab home ↗</a>'
  favicon: assets/favicon.svg
sphinx:
  config:
    # Execution is provided by JupyterLite. Omit the unused Thebe extension,
    # whose duplicate inline declarations cause browser errors in this Book stack.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
    html_show_copyright: true
    suppress_warnings: ['mystnb.unknown_mime_type']
    html_extra_path: []
launch_buttons:
  thebe: false
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - html_image

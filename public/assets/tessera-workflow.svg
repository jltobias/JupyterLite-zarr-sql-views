<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">GeoTessera: a year becomes a vector</title>
<desc id="desc">Conceptual infographic, not observed data. Sentinel optical and radar observations become annual 128-dimensional vectors. Similarity, PCA and clusters reveal patterns. Independent evidence is needed to interpret environmental change.</desc>
<defs><linearGradient id="bg"><stop stop-color="#092832"/><stop offset="1" stop-color="#102e3e"/></linearGradient><linearGradient id="s"><stop stop-color="#6ce0ba"/><stop offset=".5" stop-color="#70b6e7"/><stop offset="1" stop-color="#ddb781"/></linearGradient></defs>
<rect width="1280" height="440" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="42" y="49" fill="#8de2bd" font-size="14" letter-spacing="3">GEOTESSERA / EMBEDDING STUDIO</text>
<text x="42" y="98" fill="#f0f7f4" font-size="38" font-weight="700">A year becomes a vector.</text><text x="42" y="133" fill="#b9d1d8" font-size="18">Lagos + Abidjan &#183; real annual embeddings &#183; browser-sized experiments</text>
<g fill="#163b48" stroke="#3b5c65"><rect x="42" y="170" width="278" height="186" rx="14"/><rect x="346" y="170" width="278" height="186" rx="14"/><rect x="650" y="170" width="278" height="186" rx="14"/><rect x="954" y="170" width="284" height="186" rx="14"/></g>

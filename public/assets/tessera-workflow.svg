<g fill="url(#s)"><rect x="369" y="220" width="17" height="48"/><rect x="393" y="232" width="17" height="36"/><rect x="417" y="212" width="17" height="56"/><rect x="441" y="245" width="17" height="23"/><rect x="465" y="224" width="17" height="44"/><rect x="489" y="238" width="17" height="30"/><rect x="513" y="214" width="17" height="54"/><rect x="537" y="228" width="17" height="40"/><rect x="561" y="244" width="17" height="24"/></g>

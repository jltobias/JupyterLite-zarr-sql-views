<path d="M980 235 L992 248 1015 216 M980 264 L992 277 1015 245" stroke="#8de2bd" stroke-width="3" fill="none"/><g fill="#dbe9e9" font-size="15"><text x="1028" y="238">Independent imagery</text><text x="1028" y="268">Local reference labels</text></g>
<g fill="#f0f7f4" font-size="19" font-weight="700"><text x="62" y="302">Optical + radar</text><text x="366" y="302">128 learned features</text><text x="670" y="302">Maps + feature space</text><text x="974" y="302">Meaning needs evidence</text></g>
<g fill="#b9d1d8" font-size="15"><text x="62" y="329">Count usable observations</text><text x="366" y="329">One model, variant, snapshot</text><text x="670" y="329">Similarity, PCA, clusters</text><text x="974" y="329">A pattern is a starting question</text></g>
<text x="42" y="402" fill="#ddb781" font-size="16">Conceptual diagram &#183; Embedding scores are not temperatures, flood depths, probabilities, or social labels.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">EOPF Sentinel Zarr teaching workflow</title><desc id="desc">Discover an item in STAC, inspect GeoZarr coordinates and quality, compare direct browser maps with server-rendered tiles, and record reproducible evidence.</desc><rect width="1200" height="380" rx="24" fill="#123e48"/><g font-family="system-ui,sans-serif"><text x="42" y="58" fill="#9cd6bd" font-size="19" letter-spacing="3">EARTH IN THE BROWSER · COPERNICUS SENTINEL</text><text x="42" y="115" fill="white" font-size="40" font-weight="bold">Follow the pixels. Keep the evidence.</text><g fill="#e5f0e8"><rect x="42" y="155" width="252" height="151" rx="14"/><rect x="330" y="155" width="252" height="151" rx="14"/><rect x="618" y="155" width="252" height="151" rx="14"/><rect x="906" y="155" width="252" height="151" rx="14"/></g><g fill="#123e48" font-size="23" font-weight="bold"><text x="63" y="197">01 · Discover</text><text x="351" y="197">02 · Inspect</text><text x="639" y="197">03 · Compare</text><text x="927" y="197">04 · Explain</text></g><g fill="#315b60" font-size="18"><text x="63" y="236">STAC item and assets</text><text x="63" y="267">Coverage ≠ guarantee</text><text x="351" y="236">CRS, scale, chunks</text><text x="351" y="267">Masks before ratios</text><text x="639" y="236">OpenLayers / EOX</text><text x="639" y="267">Browser vs server</text><text x="927" y="236">Studio / eodash</text><text x="927" y="267">Claims with limits</text></g><text x="42" y="349" fill="#b9d6cb" font-size="17">One observed scene · a bounded 120 m overview · source hashes · original course illustration (ISC)</text></g></svg>

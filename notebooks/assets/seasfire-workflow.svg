<g font-family="sans-serif" font-size="19" fill="#edf5ee"><text x="45" y="326">Time × latitude × longitude</text>
<text x="286" y="173" fill="#f2bc7c">01 / DISCOVER</text><text x="286" y="212">Version + source</text><text x="286" y="242">Bounded windows</text><text x="286" y="272">Native pixels</text>
<text x="536" y="173" fill="#f2bc7c">02 / CHECK</text><text x="536" y="212">Missing ≠ zero</text><text x="536" y="242">Hectares ≠ mm</text><text x="536" y="272">Unequal durations</text>
<text x="786" y="173" fill="#f2bc7c">03 / EXPLORE</text><text x="786" y="212">Maps + SQL</text><text x="786" y="242">LexCube slices</text><text x="786" y="272">Seasonal anomalies</text>
<text x="1025" y="173" fill="#f2bc7c">04 / ASK</text><text x="1025" y="212">What changed?</text><text x="1025" y="242">What is missing?</text><text x="1025" y="272">What evidence?</text></g>
<text x="380" y="341" fill="#a5d0bb" font-family="sans-serif" font-size="16">Historical conditions and associations. Independent evidence is needed for causes and impacts.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Global FTW: from satellite composites to questions about fields</title>
<desc id="desc">Sentinel-2 composites feed PRUE, which predicts three classes. Field polygons and regional confidence have different spatial support. Climate and food-security claims require independent evidence.</desc>
<rect width="1200" height="360" rx="22" fill="#10262e"/>
<g font-family="Arial,sans-serif"><text x="38" y="49" font-size="27" fill="#eaf5f0">GLOBAL FIELDS OF THE WORLD</text><text x="38" y="78" font-size="17" fill="#b2c9cd">2024 + 2025 &#183; real model outputs &#183; browser-scale teaching windows</text>
<g fill="#1c3b43" stroke="#6bbba3" stroke-width="2"><rect x="38" y="112" width="240" height="120" rx="12"/><rect x="325" y="112" width="250" height="120" rx="12"/><rect x="622" y="112" width="250" height="120" rx="12"/><rect x="919" y="112" width="243" height="120" rx="12"/></g>
<g fill="#eaf5f0" font-size="20"><text x="58" y="145">Sentinel-2</text><text x="345" y="145">PRUE probabilities</text><text x="642" y="145">Predicted fields</text><text x="939" y="145">Questions + evidence</text></g>
<g fill="#b2c9cd" font-size="17"><text x="58" y="177">Planting / harvest</text><text x="58" y="203">annual composites</text><text x="345" y="177">Background &#183; interior</text><text x="345" y="203">boundary &#183; ~10 m pixels</text><text x="642" y="177">Polygon geometry</text><text x="642" y="203">+ 500 m confidence</text><text x="939" y="177">Floods? Water stress?</text><text x="939" y="203">Validate independently</text></g>
<g fill="#e3c47a" font-size="32"><text x="287" y="181">&#8594;</text><text x="585" y="181">&#8594;</text><text x="881" y="181">&#8594;</text></g>
<path d="M39 264H1161" stroke="#4b6b73"/><text x="38" y="297" font-size="20" fill="#e3c47a">A predicted field is not a legal parcel, a yield estimate, or a food-security assessment.</text><text x="38" y="326" font-size="15" fill="#b2c9cd">Data: Taylor Geospatial and collaborators / Global FTW, CC BY 4.0 &#183; Diagram: this teaching atlas</text></g></svg>
